name: Documentation

# Builds and deploys the Sphinx HTML documentation for EdelweissFD.
# Automatically builds on push to master and on pull requests.
# When pushed to master, the default branch, publishes the HTML build to the gh-pages branch.

on:
  push:
    branches: [ master ]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Branch selection, locked environment and EdelweissFE: see .github/actions/setup-edelweissfe.
      # Marmot is not needed: every module importing a Marmot-backed extension does so lazily or
      # tolerates its absence, so autodoc works without it.
      - uses: ./.github/actions/setup-edelweissfe
        with:
          marmot: "false"

      - name: Build EdelweissFD with documentation dependencies
        shell: bash -leo pipefail {0}
        run: |
          # the documentation dependencies are part of EdelweissFE's locked environment
          pip install -v --no-deps --no-build-isolation .

      - name: Build documentation
        shell: bash -leo pipefail {0}
        run: |
          sphinx-build ./doc/source/ ./docs -b html

      - name: Upload documentation artifact
        uses: actions/upload-artifact@v4
        with:
          name: documentation
          path: ./docs

      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/master' && github.event_name == 'push'
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          publish_branch: gh-pages
