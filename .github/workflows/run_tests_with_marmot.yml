name: Run tests

# The full test suite, which needs the constitutive models of Marmot and therefore the whole
# chain Marmot -> EdelweissFE -> EdelweissFD.

on: [push, pull_request]

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fixed thread count, so that a result does not depend on the runner's core count.
env:
  OMP_NUM_THREADS: 2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Branch selection, locked environment, Marmot and EdelweissFE: see .github/actions/setup-edelweissfe.
      - uses: ./.github/actions/setup-edelweissfe

      - name: Check that the Marmot material interfaces were built
        shell: bash -leo pipefail {0}
        run: |
          # setup.py of EdelweissFE tolerates failing extensions on purpose, so a missing
          # material interface would otherwise only surface as silently skipped tests. The
          # gradient plasticity one is not required: it is not part of every EdelweissFE release.
          python - <<'PY'
          import sys

          from edelweissfe.utils.misc import checkSuccessfulExtension

          required = [
              "edelweissfe.materials.marmot.marmothypoelastic",
              "edelweissfe.materials.marmot.marmotgradientenhancedhypoelastic",
          ]

          missing = [name for name in required if not checkSuccessfulExtension(name)]

          for name in missing:
              print("::error::the extension {:} was not built".format(name))

          sys.exit(1 if missing else 0)
          PY

      - name: Build EdelweissFD
        shell: bash -leo pipefail {0}
        run: |
          # Editable, so that the compiled kernels land next to the sources the tests import.
          pip install -v --no-deps --no-build-isolation -e .

      - name: Check that the compiled kernels were built
        shell: bash -leo pipefail {0}
        run: |
          # setup.py tolerates failing extensions on purpose (every stencil falls back to
          # Python when its kernel is missing), so a missing one would otherwise only surface
          # as silently reduced coverage of the compiled path. The gradient plasticity kernel is
          # only required if EdelweissFE provides the material it calls into.
          python - <<'PY'
          import sys

          from edelweissfe.utils.misc import checkSuccessfulExtension

          from edelweissfd.stencils import (
              displacementstencil,
              gradientenhanceddisplacementstencil,
              gradientplasticitystencil,
          )

          required = [
              ("edelweissfd.kernels.displacementkernel", displacementstencil.DisplacementKernel),
              (
                  "edelweissfd.kernels.gradientenhanceddisplacementkernel",
                  gradientenhanceddisplacementstencil.GradientEnhancedDisplacementKernel,
              ),
          ]

          if checkSuccessfulExtension("edelweissfe.materials.marmot.marmotgradientplasticityhypoelastic"):
              required.append(
                  ("edelweissfd.kernels.gradientplasticitykernel", gradientplasticitystencil.GradientPlasticityKernel)
              )

          missing = [name for name, kernel in required if kernel is None]

          for name in missing:
              print("::error::the extension {:} was not built".format(name))

          sys.exit(1 if missing else 0)
          PY

      - name: Run tests
        shell: bash -leo pipefail {0}
        run: |
          pytest -v

      - name: Run tests against the Python fallback kernel
        shell: bash -leo pipefail {0}
        env:
          EDELWEISSFD_NO_COMPILED_KERNEL: "1"
        run: |
          # both paths are live, so both are covered; test_compiledkernel.py additionally
          # asserts that they agree to round-off on the same inputs
          pytest -v

      - name: Run examples
        shell: bash -leo pipefail {0}
        run: |
          python examples/TensionBar1D/run.py
          python examples/SimpleBeam2D/run.py
          python examples/AT2PhaseFieldBar/run.py
          # CompressedPanel2D needs the gradient plasticity material family, which is not part of
          # EdelweissFE and Marmot next_v26.11; tests/test_widthconvergence.py covers it when present.
