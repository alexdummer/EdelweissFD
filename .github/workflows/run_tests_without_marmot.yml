name: Run tests without Marmot

# EdelweissFD is pure Python, but it stands on EdelweissFE, which is not on PyPI and has to be
# built from source. This job covers the tier of the test suite which needs no constitutive
# models from Marmot at all, i.e. the tests marked with anything but `marmot`, and is therefore
# the fast feedback loop.

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Mambaforge
        uses: conda-incubator/setup-miniconda@v3
        with:
          use-mamba: true
          miniforge-variant: Miniforge3
          miniforge-version: latest
          activate-environment: anaconda-client-env

      - name: Clone EdelweissFE
        shell: bash -l {0}
        run: |
          # Use github.base_ref (target of PR). If this is not a PR, fall back to the shared
          # development branch rather than to EdelweissFE's default branch, since an
          # EdelweissFD branch name essentially never matches an EdelweissFE branch name and
          # silently building against a stale, possibly API incompatible EdelweissFE is worse
          # than failing loudly.
          TARGET_BRANCH="${{ github.base_ref || 'next_v26.11' }}"

          echo "EdelweissFE branch is: $TARGET_BRANCH"

          cd ..
          git clone https://github.com/Edelweiss-Numerics/EdelweissFE.git
          cd EdelweissFE

          if git show-ref --verify --quiet refs/remotes/origin/$TARGET_BRANCH; then
            git checkout $TARGET_BRANCH
          else
            echo "::error::Branch $TARGET_BRANCH not found in EdelweissFE, and there is no safe default to fall back to."
            exit 1
          fi

      - name: Install conda packages
        shell: bash -l {0}
        run: |
          mamba install --file ../EdelweissFE/conda_requirements.txt

      - name: Install pip packages
        shell: bash -l {0}
        run: |
          pip install -r ../EdelweissFE/pip_requirements.txt

      - name: Build EdelweissFE
        shell: bash -l {0}
        run: |
          # Without Marmot the material extensions cannot be built; setup.py tolerates that on
          # purpose, and the tests which would need them are skipped below.
          pip install ../EdelweissFE

      - name: Build EdelweissFD
        shell: bash -l {0}
        run: |
          pip install '.[test]'

      - name: Run tests without Marmot
        shell: bash -l {0}
        run: |
          pytest -v -m "not marmot"
