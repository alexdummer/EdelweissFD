name: Run tests without Marmot

# EdelweissFD stands on EdelweissFE, which is not on PyPI and has to be built from source. Its
# own compiled cell kernels need Marmot too, so without it they are skipped and every stencil
# falls back to its pure-Python implementation. This job covers the tier of the test suite which
# needs no constitutive models from Marmot at all, i.e. the tests marked with anything but
# `marmot`, and is therefore the fast feedback loop.

on: [push, pull_request]

# A newer push to the same branch or pull request supersedes the run in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Fixed thread count, so that a result does not depend on the runner's core count.
env:
  OMP_NUM_THREADS: 2

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      # Branch selection, locked environment and EdelweissFE: see .github/actions/setup-edelweissfe.
      - uses: ./.github/actions/setup-edelweissfe
        with:
          marmot: "false"

      - name: Build EdelweissFD
        shell: bash -leo pipefail {0}
        run: |
          pip install -v --no-deps --no-build-isolation -e .

      - name: Run tests without Marmot
        shell: bash -leo pipefail {0}
        run: |
          pytest -v -m "not marmot"
